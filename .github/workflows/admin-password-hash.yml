name: Generate Nanti admin password hash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: admin-bootstrap
    env:
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate password hash for Vercel
        shell: bash
        run: |
          if [ -z "$ADMIN_BOOTSTRAP_PASSWORD" ]; then
            echo "::error::Set ADMIN_BOOTSTRAP_PASSWORD in GitHub environment admin-bootstrap first."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { hashAdminPassword } from './server/admin-credentials.ts';
          const password = process.env.ADMIN_BOOTSTRAP_PASSWORD;
          const hash = await hashAdminPassword(password);
          console.log('Username: nanti.admin');
          console.log('NANTI_ADMIN_PASSWORD_HASH=' + hash);
          console.log('Copy the hash to Vercel Production Environment Variables. Never share the hash publicly.');
          NODE
