name: Nanti CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: nanti_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:test-root-only@127.0.0.1:3306/nanti_migration_test
      TEST_DATABASE_URL: mysql://root:test-root-only@127.0.0.1:3306/nanti_migration_test
      SESSION_SECRET: disposable-github-actions-test-secret-only-32bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create test artifact directory
        run: mkdir -p test-results/browser
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          npx --yes playwright@1.65.1 install --with-deps chromium 2>&1 | tee test-results/playwright-install.log
          node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(`NANTI_BROWSER_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - run: npx prisma validate
      - run: npm run db:migrate
      - run: npx prisma migrate status
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Run full unit and MySQL integration suite
        run: set -o pipefail && npm test 2>&1 | tee test-results/vitest.log
      - run: node --import tsx scripts/test-recommendation-mysql.ts
      - run: npm run build
      - name: Run Tokopedia preview-to-wishlist browser E2E
        run: |
          set -o pipefail
          node --import tsx tests/browser-tokopedia-import-server.ts > test-results/tokopedia-server.log 2>&1 &
          fixture_server=$!
          trap 'kill "$fixture_server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
          NANTI_BROWSER_BASE_URL=http://127.0.0.1:3000 \
            NANTI_BROWSER_ARTIFACTS=test-results/browser \
            node tests/browser-tokopedia-import.mjs 2>&1 | tee test-results/tokopedia-browser.log
      - name: Run MVP and Superadmin browser E2E against disposable MySQL
        run: |
          set -o pipefail
          export NANTI_ADMIN_USERNAME=nanti-ci-admin
          export NANTI_TEST_ADMIN_USERNAME="$NANTI_ADMIN_USERNAME"
          export NANTI_TEST_ADMIN_PASSWORD=isolated-ci-only-superadmin-password
          admin_hash="$(printf '%s' "$NANTI_TEST_ADMIN_PASSWORD" | node --import tsx scripts/hash-admin-password.mjs)"
          export NANTI_ADMIN_PASSWORD_HASH="$admin_hash"
          npm start > test-results/mvp-server.log 2>&1 &
          app_server=$!
          trap 'kill "$app_server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
          NANTI_BROWSER_BASE_URL=http://127.0.0.1:3000 \
            NANTI_BROWSER_ARTIFACTS=test-results/browser \
            npm run test:browser:mvp 2>&1 | tee test-results/browser-mvp.log
          NANTI_BROWSER_BASE_URL=http://127.0.0.1:3000 \
            NANTI_BROWSER_ARTIFACTS=test-results/browser \
            npm run test:browser:affiliate 2>&1 | tee test-results/browser-affiliate.log
      - name: Run recommendation workspace acceptance journey
        run: |
          set -o pipefail
          NANTI_BROWSER_ARTIFACTS=test-results/browser/recommendations \
            node --import tsx tests/browser-recommendation-workspace.mjs 2>&1 | tee test-results/browser-recommendations.log
      - name: Test public navigation and recommendation inbox
        run: |
          set -o pipefail
          npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4173/ >/dev/null
          export NANTI_BROWSER_BASE_URL=http://127.0.0.1:4173
          node tests/browser-header.mjs 2>&1 | tee test-results/browser-header.log
          node tests/browser-navigation-journey.mjs 2>&1 | tee test-results/browser-navigation-journey.log
      - name: Run account, creator, and design browser suites
        run: |
          set +e
          set -o pipefail
          npm run test:browser:accounts 2>&1 | tee test-results/browser-accounts.log
          accounts_status=$?
          npm run test:browser:creator 2>&1 | tee test-results/browser-creator.log
          creator_status=$?
          npm run test:browser:creator-design 2>&1 | tee test-results/browser-creator-design.log
          design_status=$?
          if [ "$accounts_status" -ne 0 ] || [ "$creator_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "Browser suite status: accounts=$accounts_status creator=$creator_status design=$design_status"
            exit 1
          fi
      - name: Upload test logs and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanti-ci-diagnostics-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  tidb-product-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/nanti_product_test
      TEST_DATABASE_URL: mysql://root@127.0.0.1:4000/nanti_product_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable TiDB
        run: |
          docker run -d --name nanti-tidb -p 127.0.0.1:4000:4000 --entrypoint /tidb-server \
            pingcap/tidb:v8.5.8 --host=0.0.0.0 --store=unistore --path=/tmp/nanti-tidb
          node --input-type=module <<'NODE'
          import { createConnection } from 'mariadb';
          import { setTimeout } from 'node:timers/promises';
          for (let attempt = 0; ; attempt++) {
            try {
              const db = await createConnection({ host: '127.0.0.1', port: 4000, user: 'root', connectTimeout: 1000 });
              try {
                await db.query('CREATE DATABASE IF NOT EXISTS nanti_product_test');
              } finally {
                await db.end();
              }
              break;
            } catch (error) {
              if (attempt === 30) throw error;
              await setTimeout(1000);
            }
          }
          NODE
      - run: npm run db:migrate
      - run: npx prisma migrate status
      - run: npm test -- tests/affiliate-api.test.ts tests/mysql-product-images.test.ts tests/recommendation-workspace.test.ts
